<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Dark background -->
  <rect width="32" height="32" rx="5" fill="#1a1a1a"/>
  <!-- Outer ring -->
  <circle cx="16" cy="16" r="13.5" fill="none" stroke="#FFFACD" stroke-width="0.8"/>
  <!-- 6 aperture blades -->
  <g transform="translate(16,16)" opacity="0.93">
    <ellipse cx="0" cy="-6.2" rx="2.9" ry="5.5" fill="#FFFACD" transform="rotate(0)"/>
    <ellipse cx="0" cy="-6.2" rx="2.9" ry="5.5" fill="#FFFACD" transform="rotate(60)"/>
    <ellipse cx="0" cy="-6.2" rx="2.9" ry="5.5" fill="#FFFACD" transform="rotate(120)"/>
    <ellipse cx="0" cy="-6.2" rx="2.9" ry="5.5" fill="#FFFACD" transform="rotate(180)"/>
    <ellipse cx="0" cy="-6.2" rx="2.9" ry="5.5" fill="#FFFACD" transform="rotate(240)"/>
    <ellipse cx="0" cy="-6.2" rx="2.9" ry="5.5" fill="#FFFACD" transform="rotate(300)"/>
    <!-- Central opening -->
    <circle cx="0" cy="0" r="4.2" fill="#1a1a1a"/>
    <circle cx="0" cy="0" r="3.9" fill="none" stroke="#FFFACD" stroke-width="0.35" opacity="0.5"/>
    <circle cx="0" cy="0" r="0.85" fill="#FFFACD" opacity="0.7"/>
  </g>
</svg>
